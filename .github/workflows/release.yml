name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  windows-sandbox-helper:
    uses: ./.github/workflows/windows-sandbox.yml

  publish:
    needs: windows-sandbox-helper
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux process prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap build-essential make g++
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-sandbox-helper
          path: backend/packages/tools/native/windows
      - name: Verify tagged commit belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify release metadata and tag
        run: npm run release:verify -- --tag "$GITHUB_REF_NAME" --require-windows-helper
      - name: Verify compatibility policy and documentation
        run: npm run release:compatibility
      - run: npm run contracts:check
      - run: npm run lint
      - name: Run deterministic test suites
        run: npm run test:ci
      - run: npm run typecheck
      - run: npm run smoke:m8
      - name: Prepare release evidence directory
        run: >-
          node -e "require('node:fs').mkdirSync('release-evidence', { recursive: true })"
      - name: Validate every packed npm artifact
        run: >-
          npm run --silent smoke:package -- --all-platforms --require-windows-helper
          > release-evidence/ubuntu-packed.json
      - name: Validate predecessor upgrade, downgrade, and migration rollback
        run: >-
          npm run smoke:release-compatibility --
          --evidence release-evidence/ubuntu-upgrade.json
      - name: Upload sanitized release compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-compatibility-tag-${{ github.ref_name }}
          path: release-evidence/ubuntu-*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dist_tag="latest"
          if [[ "$version" == *-* ]]; then
            dist_tag="next"
          fi
          npm run release:publish -- --confirm "$version" --tag "$dist_tag" --provenance
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          args=("$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
