name: cross-platform

on:
  push:
    branches:
      - main
    tags-ignore:
      - "ci-windows-sandbox-*"
  pull_request:
  schedule:
    # Nightly, so the slow and privileged gates still report on a moving main.
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, platform-relevant gates. These are the ones a change should be judged
  # by during development: build, generated contracts, lint, types and unit tests.
  fast-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux process prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap build-essential make g++
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # The unit suite reads the host sandbox state: `doctor` reports an unready
      # sandbox as a failed check, so the helper has to be present and set up
      # here as well.
      - name: Build Node Windows sandbox helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake `
            -S native/windows-sandbox-helper `
            -B native/windows-sandbox-helper/build `
            -A x64
          cmake --build native/windows-sandbox-helper/build --config Release --target mycli-windows-sandbox
          New-Item -ItemType Directory -Force backend/packages/tools/native/windows | Out-Null
          Copy-Item `
            native/windows-sandbox-helper/build/Release/mycli-windows-sandbox.exe `
            backend/packages/tools/native/windows/mycli-windows-sandbox.exe
      - name: Initialize Windows sandbox identities
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & backend/packages/tools/native/windows/mycli-windows-sandbox.exe --ensure-setup
          if ($LASTEXITCODE -ne 0) { throw "Windows sandbox setup failed" }
      - run: npm ci
      # Each step runs even when an earlier one failed, so one run reports every
      # failure instead of only the first, and the wrapper republishes each
      # failing step's diagnostics as annotations.
      - name: Build
        run: node scripts/run-gate.mjs build "npm run build"
      - name: Verify generated contracts
        if: '!cancelled()'
        run: node scripts/run-gate.mjs contracts "npm run contracts:check"
      - name: Lint
        if: '!cancelled()'
        run: node scripts/run-gate.mjs lint "npm run lint"
      - name: Typecheck
        if: '!cancelled()'
        run: node scripts/run-gate.mjs typecheck "npm run typecheck"
      - name: Unit and contract suites
        if: '!cancelled()'
        run: node scripts/run-gate.mjs unit-suites "node scripts/run-test-suite.mjs --suite unit --suite contract"

  # Slower gates that need platform tooling. They run for pull requests, main and
  # the nightly, but not for every push to a working branch.
  slow-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        node-version: ["22.19.0", "24.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux process prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap build-essential make g++
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build Node Windows sandbox helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake `
            -S native/windows-sandbox-helper `
            -B native/windows-sandbox-helper/build `
            -A x64
          cmake --build native/windows-sandbox-helper/build --config Release --target mycli-windows-sandbox
          New-Item -ItemType Directory -Force backend/packages/tools/native/windows | Out-Null
          Copy-Item `
            native/windows-sandbox-helper/build/Release/mycli-windows-sandbox.exe `
            backend/packages/tools/native/windows/mycli-windows-sandbox.exe
      - name: Initialize Windows sandbox identities
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & backend/packages/tools/native/windows/mycli-windows-sandbox.exe --ensure-setup
          if ($LASTEXITCODE -ne 0) { throw "Windows sandbox setup failed" }
      - run: npm ci
      - name: Build
        run: node scripts/run-gate.mjs build "npm run build"
      - name: Integration, platform and release suites
        if: '!cancelled()'
        run: node scripts/run-gate.mjs slow-suites "node scripts/run-test-suite.mjs --suite integration --suite platform --suite release"
      - name: Provider-free M8 smoke
        if: '!cancelled()'
        run: node scripts/run-gate.mjs m8-smoke "npm run smoke:m8"
      - name: Packed npm CLI smoke
        if: '!cancelled()'
        run: node scripts/run-gate.mjs packed-smoke "npm run smoke:package"

  # Benchmarks and the privileged Windows acceptance are nightly and on demand:
  # they are slow, run on shared hardware, and should not decide a pull request.
  agent-worker-memory-benchmark:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Measure Agent Worker memory scenarios
        run: npm run benchmark:agent-workers -- --output agent-worker-memory.jsonl
      - name: Measure 500-compaction resume and transcript paging
        if: '!cancelled()'
        run: npm run --silent benchmark:long-history -- --profile compact_stress --storage-schema v15 > compact-stress-resume.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-worker-memory-${{ runner.os }}
          path: |
            agent-worker-memory.jsonl
            compact-stress-resume.json

  node-m8-live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fast-gate, slow-gate]
    runs-on: ubuntu-latest
    environment: node-m8-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux process prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap build-essential make g++
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci
      - run: npm run build
      - name: Node M8 live Responses smoke
        shell: bash
        env:
          MYCLI_API_KEY: ${{ secrets.MYCLI_API_KEY }}
          MYCLI_BASE_URL: ${{ secrets.MYCLI_BASE_URL }}
          MYCLI_MODEL: ${{ secrets.MYCLI_MODEL }}
          MYCLI_PROVIDER: ${{ secrets.MYCLI_PROVIDER }}
        run: |
          set +e
          node scripts/smoke_node_m5_state.mjs --protocol responses
          code=$?
          set -e
          if [ "$code" -eq 77 ]; then
            exit 0
          fi
          exit "$code"

  windows-sandbox-helper:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    uses: ./.github/workflows/windows-sandbox.yml
    with:
      windows-image: ${{ matrix.os }}
      artifact-name: windows-sandbox-helper-${{ matrix.os }}
