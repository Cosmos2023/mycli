name: cross-platform

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: tui/mycli-shell/package-lock.json
      - name: Build packaged Windows sandbox helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake `
            -S native/windows-sandbox-helper `
            -B native/windows-sandbox-helper/build `
            -A x64
          cmake --build native/windows-sandbox-helper/build --config Release
          Copy-Item `
            native/windows-sandbox-helper/build/Release/mycli-windows-sandbox.exe `
            src/mycli/native/windows/mycli-windows-sandbox.exe
      - run: uv sync --locked --dev
      - run: npm ci --prefix tui/mycli-shell
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy src/mycli
      - run: npm --prefix tui/mycli-shell test
      - run: npm --prefix tui/mycli-shell run typecheck
      - name: Shell lifecycle smoke
        run: uv run pytest tests/integration/test_cross_platform_shell.py -q

  windows-shell-smoke:
    strategy:
      fail-fast: false
      matrix:
        shell_mode: [pwsh, powershell, cmd]
    runs-on: windows-latest
    env:
      MYCLI_TEST_SHELL_MODE: ${{ matrix.shell_mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --dev
      - name: Native shell lifecycle smoke (${{ matrix.shell_mode }})
        run: uv run pytest tests/integration/test_cross_platform_shell.py -q

  windows-conpty-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --dev
      - name: ConPTY transport and shell integration smoke
        run: >-
          uv run pytest
          tests/unit/tools/shell_transport/test_windows_conpty.py
          tests/integration/test_cross_platform_shell.py
          -q

  windows-sandbox-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build helper
        shell: pwsh
        run: |
          cmake `
            -S native/windows-sandbox-helper `
            -B native/windows-sandbox-helper/build `
            -A x64
          cmake --build native/windows-sandbox-helper/build --config Release
          ctest --test-dir native/windows-sandbox-helper/build -C Release --output-on-failure
      - name: Smoke-test helper handshake
        shell: pwsh
        run: |
          $helper = "native/windows-sandbox-helper/build/Release/mycli-windows-sandbox.exe"
          & $helper --setup
          if ($LASTEXITCODE -ne 0) { throw "sandbox setup failed" }
          $handshake = & $helper --handshake | ConvertFrom-Json
          if ($handshake.name -ne "mycli-windows-sandbox") { throw "helper identity mismatch" }
          if ($handshake.protocol_version -ne 1) { throw "helper protocol mismatch" }
          if ($handshake.setup_complete -ne $true) { throw "helper setup is incomplete" }
          if ($handshake.sandbox_ready -ne $false) { throw "incomplete helper must fail closed" }
      - name: Enforce filesystem and network boundaries
        shell: pwsh
        run: |
          $helper = (Resolve-Path "native/windows-sandbox-helper/build/Release/mycli-windows-sandbox.exe").Path
          $probe = (Resolve-Path "native/windows-sandbox-helper/build/Release/mycli-windows-sandbox-probe.exe").Path
          $workspace = Join-Path $env:RUNNER_TEMP "mycli-sandbox-workspace"
          $outside = Join-Path $env:RUNNER_TEMP "mycli-sandbox-outside.txt"
          New-Item -ItemType Directory -Force -Path $workspace, (Join-Path $workspace ".git") | Out-Null
          Set-Content -NoNewline -Path (Join-Path $workspace ".env") -Value "secret"

          function Invoke-Sandbox([string[]] $commandArgs) {
            $request = @{
              protocol_version = 1
              command = @{ argv = $commandArgs }
              cwd = $workspace
              workspace_roots = @($workspace)
              writable_roots = @($workspace)
              denied_read_roots = @()
              denied_read_globs = @("**/.env", "**/.env.*")
              filesystem = "workspace_write"
              network = "disabled"
              mode = "workspace-write"
            } | ConvertTo-Json -Depth 5 -Compress
            & $helper --request-json $request
            return $LASTEXITCODE
          }

          $inside = Join-Path $workspace "inside.txt"
          if ((Invoke-Sandbox @($probe, "--write-file", $inside)) -ne 0) {
            throw "sandbox could not write inside workspace"
          }
          if (-not (Test-Path $inside)) { throw "inside write did not create a file" }
          if ((Invoke-Sandbox @($probe, "--write-file", $outside)) -eq 0) {
            throw "sandbox wrote outside workspace"
          }
          if (Test-Path $outside) { throw "outside write created a file" }
          if ((Invoke-Sandbox @($probe, "--read-file", (Join-Path $workspace ".env"))) -eq 0) {
            throw "sandbox read a denied secret"
          }
          if ((Invoke-Sandbox @($probe, "--write-file", (Join-Path $workspace ".git/config"))) -eq 0) {
            throw "sandbox wrote protected repository metadata"
          }

          $portFile = Join-Path $env:RUNNER_TEMP "mycli-sandbox-port.txt"
          $server = Start-Process -FilePath $probe -ArgumentList @("--listen", $portFile) -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(10)
            while (-not (Test-Path $portFile)) {
              if ((Get-Date) -gt $deadline) { throw "network test server did not start" }
              Start-Sleep -Milliseconds 50
            }
            $port = (Get-Content $portFile -Raw).Trim()
            if ((Invoke-Sandbox @($probe, "--connect", $port)) -eq 0) {
              throw "offline sandbox connected to a loopback server"
            }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
