name: cross-platform

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "ci-windows-sandbox-*"
  pull_request:

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-worker-memory-benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Measure Agent Worker memory scenarios
        run: npm run benchmark:agent-workers -- --output agent-worker-memory.jsonl
      - name: Measure 500-compaction resume and transcript paging
        run: npm run --silent benchmark:long-history -- --profile compact_stress > compact-stress-resume.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-worker-memory-${{ runner.os }}
          path: |
            agent-worker-memory.jsonl
            compact-stress-resume.json

  node-m8-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22.19.0", "24.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux process prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap build-essential make g++
      - name: Build Node Windows sandbox helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake `
            -S native/windows-sandbox-helper `
            -B native/windows-sandbox-helper/build `
            -A x64
          cmake --build native/windows-sandbox-helper/build --config Release --target mycli-windows-sandbox
          New-Item -ItemType Directory -Force backend/packages/tools/native/windows | Out-Null
          Copy-Item `
            native/windows-sandbox-helper/build/Release/mycli-windows-sandbox.exe `
            backend/packages/tools/native/windows/mycli-windows-sandbox.exe
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - name: Node M8 retirement gate
        run: npm run test:m8
      - name: Provider-free M8 smoke
        run: npm run smoke:m8
      - name: Packed npm CLI smoke
        run: npm run smoke:package

  node-m8-live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: node-m8-gate
    runs-on: ubuntu-latest
    environment: node-m8-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap build-essential make g++
      - run: npm ci
      - run: npm run build
      - name: Node M8 live Responses smoke
        shell: bash
        env:
          MYCLI_API_KEY: ${{ secrets.MYCLI_API_KEY }}
          MYCLI_BASE_URL: ${{ secrets.MYCLI_BASE_URL }}
          MYCLI_MODEL: ${{ secrets.MYCLI_MODEL }}
          MYCLI_PROVIDER: ${{ secrets.MYCLI_PROVIDER }}
        run: |
          set +e
          node scripts/smoke_node_m5_state.mjs --protocol responses
          code=$?
          set -e
          if [ "$code" -eq 77 ]; then
            exit 0
          fi
          exit "$code"

  windows-sandbox-helper:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish Windows sandbox started marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-started $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-started --force
      - name: Configure helper build
        shell: pwsh
        run: |
          cmake `
            -S native/windows-sandbox-helper `
            -B native/windows-sandbox-helper/build `
            -A x64
      - name: Publish Windows sandbox configure marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-configured $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-configured --force
      - name: Compile sandbox helper
        shell: pwsh
        run: |
          $output = & cmake --build native/windows-sandbox-helper/build --config Release --target mycli-windows-sandbox 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath windows-sandbox-compile.log
          exit $exitCode
      - name: Publish Windows sandbox compile failure
        if: failure() && github.event_name == 'push'
        shell: pwsh
        run: |
          $message = Get-Content windows-sandbox-compile.log -Raw
          if ($message.Length -gt 12000) {
            $message = $message.Substring($message.Length - 12000)
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a -f ci-windows-sandbox-compile-failed $env:GITHUB_SHA -m $message
          git push origin refs/tags/ci-windows-sandbox-compile-failed --force
      - name: Publish Windows sandbox helper compile marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-helper-compiled $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-helper-compiled --force
      - name: Compile protocol tests
        shell: pwsh
        run: |
          cmake --build native/windows-sandbox-helper/build --config Release --target mycli-windows-sandbox-protocol-tests
      - name: Publish Windows sandbox protocol compile marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-protocol-compiled $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-protocol-compiled --force
      - name: Compile primitives tests
        shell: pwsh
        run: |
          cmake --build native/windows-sandbox-helper/build --config Release --target mycli-windows-sandbox-primitives-tests
      - name: Publish Windows sandbox primitives compile marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-primitives-compiled $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-primitives-compiled --force
      - name: Compile sandbox probe
        shell: pwsh
        run: |
          cmake --build native/windows-sandbox-helper/build --config Release --target mycli-windows-sandbox-probe
      - name: Publish Windows sandbox probe compile marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-probe-compiled $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-probe-compiled --force
      - name: Publish Windows sandbox compile marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-compiled $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-compiled --force
      - name: Run protocol tests
        shell: pwsh
        run: |
          $output = & ctest --test-dir native/windows-sandbox-helper/build -C Release --output-on-failure -R '^protocol$' 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath windows-sandbox-tests.log
          exit $exitCode
      - name: Publish Windows sandbox test failure
        if: failure() && github.event_name == 'push'
        shell: pwsh
        run: |
          $message = Get-Content windows-sandbox-tests.log -Raw
          if ($message.Length -gt 12000) {
            $message = $message.Substring($message.Length - 12000)
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a -f ci-windows-sandbox-tests-failed $env:GITHUB_SHA -m $message
          git push origin refs/tags/ci-windows-sandbox-tests-failed --force
      - name: Publish Windows sandbox protocol test marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-protocol-passed $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-protocol-passed --force
      - name: Run primitives tests
        shell: pwsh
        run: |
          $output = & ctest --test-dir native/windows-sandbox-helper/build -C Release --output-on-failure -R '^windows_primitives$' 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath windows-sandbox-tests.log
          exit $exitCode
      - name: Publish Windows sandbox primitives test failure
        if: failure() && github.event_name == 'push'
        shell: pwsh
        run: |
          $message = Get-Content windows-sandbox-tests.log -Raw
          if ($message.Length -gt 12000) {
            $message = $message.Substring($message.Length - 12000)
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a -f ci-windows-sandbox-tests-failed $env:GITHUB_SHA -m $message
          git push origin refs/tags/ci-windows-sandbox-tests-failed --force
      - name: Publish Windows sandbox primitives test marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-primitives-passed $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-primitives-passed --force
      - name: Publish Windows sandbox build marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-built $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-built --force
      - name: Smoke-test helper handshake
        timeout-minutes: 3
        shell: pwsh
        run: |
          $helper = "native/windows-sandbox-helper/build/Release/mycli-windows-sandbox.exe"
          $setup = Start-Process `
            -FilePath $helper `
            -ArgumentList "--setup" `
            -NoNewWindow `
            -Wait `
            -PassThru `
            -RedirectStandardOutput windows-sandbox-setup.stdout.log `
            -RedirectStandardError windows-sandbox-setup.stderr.log
          Get-Content windows-sandbox-setup.stdout.log, windows-sandbox-setup.stderr.log |
            Tee-Object -FilePath windows-sandbox-setup.log
          if ($setup.ExitCode -ne 0) { throw "sandbox setup failed" }
          $handshakeOutput = & $helper --handshake
          $handshakeOutput | Tee-Object -FilePath windows-sandbox-setup.log -Append
          if ($LASTEXITCODE -ne 0) { throw "sandbox handshake failed" }
          $handshake = $handshakeOutput | ConvertFrom-Json
          if ($handshake.name -ne "mycli-windows-sandbox") { throw "helper identity mismatch" }
          if ($handshake.protocol_version -ne 1) { throw "helper protocol mismatch" }
          if ($handshake.setup_complete -ne $true) { throw "helper setup is incomplete" }
          if ($handshake.sandbox_ready -ne $false) { throw "incomplete helper must fail closed" }
      - name: Publish Windows sandbox setup failure
        if: failure() && github.event_name == 'push'
        shell: pwsh
        run: |
          if (Test-Path windows-sandbox-setup.log) {
            $message = Get-Content windows-sandbox-setup.log -Raw
          } else {
            $logs = @(
              "windows-sandbox-setup.stdout.log",
              "windows-sandbox-setup.stderr.log"
            ) | Where-Object { Test-Path $_ }
            if ($logs.Count -gt 0) {
              $message = Get-Content $logs -Raw
            } else {
              $message = "Windows sandbox setup failed before producing output"
            }
          }
          if ($message.Length -gt 12000) {
            $message = $message.Substring($message.Length - 12000)
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a -f ci-windows-sandbox-setup-failed $env:GITHUB_SHA -m $message
          git push origin refs/tags/ci-windows-sandbox-setup-failed --force
      - name: Publish Windows sandbox setup marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-setup-passed $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-setup-passed --force
      - name: Enforce filesystem boundaries
        timeout-minutes: 3
        shell: pwsh
        run: |
          $helper = (Resolve-Path "native/windows-sandbox-helper/build/Release/mycli-windows-sandbox.exe").Path
          $probe = (Resolve-Path "native/windows-sandbox-helper/build/Release/mycli-windows-sandbox-probe.exe").Path
          $log = "windows-sandbox-filesystem.log"
          $workspace = Join-Path $env:RUNNER_TEMP "mycli-sandbox-workspace"
          $outside = Join-Path $env:RUNNER_TEMP "mycli-sandbox-outside.txt"
          $protectedMetadata = @(".git", ".agents", ".codex")
          $protectedPaths = $protectedMetadata | ForEach-Object { Join-Path $workspace $_ }
          New-Item -ItemType Directory -Force -Path (@($workspace) + $protectedPaths) | Out-Null
          Set-Content -NoNewline -Path (Join-Path $workspace ".env") -Value "secret"
          $private = Join-Path $workspace "private"
          New-Item -ItemType Directory -Force -Path $private | Out-Null
          $privateSecret = Join-Path $private "secret.txt"
          Set-Content -NoNewline -Path $privateSecret -Value "private"

          function Invoke-Sandbox(
            [string[]] $commandArgs,
            [string[]] $deniedReadRoots = @(),
            [string] $stdinText = ""
          ) {
            Add-Content -Path $log -Value "invoke: $($commandArgs[1])"
            $request = @{
              protocol_version = 1
              command = @{ argv = $commandArgs }
              cwd = $workspace
              workspace_roots = @($workspace)
              writable_roots = @($workspace)
              denied_read_roots = $deniedReadRoots
              denied_read_globs = @("**/.env", "**/.env.*")
              filesystem = "workspace_write"
              network = "disabled"
              mode = "workspace-write"
            } | ConvertTo-Json -Depth 5 -Compress
            if (-not $PSBoundParameters.ContainsKey("stdinText")) {
              $output = & $helper --request-json $request 2>&1
              $exitCode = $LASTEXITCODE
            } else {
              $output = $stdinText | & $helper --request-json $request 2>&1
              $exitCode = $LASTEXITCODE
            }
            $output | Tee-Object -FilePath $log -Append | Out-Host
            Add-Content -Path $log -Value "exit: $exitCode"
            return $exitCode
          }

          $inside = Join-Path $workspace "inside.txt"
          if ((Invoke-Sandbox @($probe, "--stdio")) -ne 0) {
            throw "sandbox stdio probe failed"
          }
          $stdioLog = Get-Content $log -Raw
          if ($stdioLog -notmatch "sandbox-stdout-ok" -or
              $stdioLog -notmatch "sandbox-stderr-ok") {
            throw "sandbox stdio was not forwarded"
          }
          if ((Invoke-Sandbox `
                -commandArgs @($probe, "--stdio-echo") `
                -stdinText "sandbox-stdin-ok") -ne 0) {
            throw "sandbox stdin probe failed"
          }
          $stdioLog = Get-Content $log -Raw
          if ($stdioLog -notmatch "sandbox-stdin:sandbox-stdin-ok") {
            throw "sandbox stdin was not forwarded"
          }
          if ((Invoke-Sandbox @($probe, "--write-file", $inside)) -ne 0) {
            throw "sandbox could not write inside workspace"
          }
          if (-not (Test-Path $inside)) { throw "inside write did not create a file" }
          if ((Invoke-Sandbox @($probe, "--write-file", $outside)) -eq 0) {
            throw "sandbox wrote outside workspace"
          }
          if (Test-Path $outside) { throw "outside write created a file" }
          if ((Invoke-Sandbox @($probe, "--read-file", (Join-Path $workspace ".env"))) -eq 0) {
            throw "sandbox read a denied secret"
          }
          if ((Invoke-Sandbox `
                -commandArgs @($probe, "--read-file", $privateSecret) `
                -deniedReadRoots @($private)) -eq 0) {
            throw "sandbox read an explicit denied-read root"
          }
          foreach ($protectedPath in $protectedPaths) {
            $protectedFile = Join-Path $protectedPath "config"
            if ((Invoke-Sandbox @($probe, "--write-file", $protectedFile)) -eq 0) {
              throw "sandbox wrote protected metadata: $protectedPath"
            }
          }
          $global:LASTEXITCODE = 0
      - name: Publish Windows sandbox filesystem failure
        if: failure() && github.event_name == 'push'
        shell: pwsh
        run: |
          if (Test-Path windows-sandbox-filesystem.log) {
            $message = Get-Content windows-sandbox-filesystem.log -Raw
          } else {
            $message = "Windows sandbox filesystem test failed before producing output"
          }
          if ($message.Length -gt 12000) {
            $message = $message.Substring($message.Length - 12000)
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a -f ci-windows-sandbox-filesystem-failed $env:GITHUB_SHA -m $message
          git push origin refs/tags/ci-windows-sandbox-filesystem-failed --force
      - name: Publish Windows sandbox filesystem marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-filesystem-passed $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-filesystem-passed --force
      - name: Enforce network boundary
        timeout-minutes: 3
        shell: pwsh
        run: |
          $helper = (Resolve-Path "native/windows-sandbox-helper/build/Release/mycli-windows-sandbox.exe").Path
          $probe = (Resolve-Path "native/windows-sandbox-helper/build/Release/mycli-windows-sandbox-probe.exe").Path
          $log = "windows-sandbox-network.log"
          $workspace = Join-Path $env:RUNNER_TEMP "mycli-sandbox-workspace"

          function Invoke-Sandbox([string[]] $commandArgs) {
            Add-Content -Path $log -Value "invoke: $($commandArgs[1])"
            $request = @{
              protocol_version = 1
              command = @{ argv = $commandArgs }
              cwd = $workspace
              workspace_roots = @($workspace)
              writable_roots = @($workspace)
              denied_read_roots = @()
              denied_read_globs = @("**/.env", "**/.env.*")
              filesystem = "workspace_write"
              network = "disabled"
              mode = "workspace-write"
            } | ConvertTo-Json -Depth 5 -Compress
            & $helper --request-json $request 2>&1 |
              Tee-Object -FilePath $log -Append |
              Out-Host
            $exitCode = $LASTEXITCODE
            Add-Content -Path $log -Value "exit: $exitCode"
            return $exitCode
          }

          foreach ($family in @(
            @{ Listen = "--listen"; Connect = "--connect"; Name = "IPv4" },
            @{ Listen = "--listen6"; Connect = "--connect6"; Name = "IPv6" }
          )) {
            $portFile = Join-Path $env:RUNNER_TEMP "mycli-sandbox-port-$($family.Name).txt"
            $server = Start-Process `
              -FilePath $probe `
              -ArgumentList @($family.Listen, $portFile) `
              -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(10)
              while (-not (Test-Path $portFile)) {
                if ((Get-Date) -gt $deadline) {
                  throw "$($family.Name) network test server did not start"
                }
                Start-Sleep -Milliseconds 50
              }
              $port = (Get-Content $portFile -Raw).Trim()
              if ((Invoke-Sandbox @($probe, $family.Connect, $port)) -eq 0) {
                throw "offline sandbox connected to an $($family.Name) loopback server"
              }
              $global:LASTEXITCODE = 0
            } finally {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Publish Windows sandbox network failure
        if: failure() && github.event_name == 'push'
        shell: pwsh
        run: |
          if (Test-Path windows-sandbox-network.log) {
            $message = Get-Content windows-sandbox-network.log -Raw
          } else {
            $message = "Windows sandbox network test failed before producing output"
          }
          if ($message.Length -gt 12000) {
            $message = $message.Substring($message.Length - 12000)
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a -f ci-windows-sandbox-network-failed $env:GITHUB_SHA -m $message
          git push origin refs/tags/ci-windows-sandbox-network-failed --force
      - name: Publish Windows sandbox network marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-network-passed $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-network-passed --force
      - name: Publish Windows sandbox verification marker
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git tag -f ci-windows-sandbox-passed $env:GITHUB_SHA
          git push origin refs/tags/ci-windows-sandbox-passed --force
