[project]
name = "mycli"
version = "0.1.0"
description = "CLI-hosted ReAct personal coding agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.97.0",
    "langchain>=1.2.15",
    "openai>=2.30.0",
    "pygments>=2.20.0",
    "rich>=15.0.0",
    "structlog>=25.5.0",
    "textual>=8.2,<9",
    "tiktoken>=0.12.0",
]

[project.scripts]
mycli = "mycli.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest>=9.0.2",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["mycli"]

[tool.hatch.build.targets.wheel]
packages = ["src/mycli"]
